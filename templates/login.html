<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 40px;
            border-radius: 22px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.30);
        }

        .icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
        }

        h1 {
            margin: 0;
            text-align: center;
            font-size: 29px;
            color: #0f172a;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin: 8px 0 28px;
            font-size: 14px;
        }

        .error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 18px;
            font-size: 14px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            background: #f8fafc;
            font-size: 15px;
            outline: none;
            margin-bottom: 18px;
        }

        input:focus {
            border-color: #334155;
            background: white;
            box-shadow: 0 0 0 3px rgba(51,65,85,0.08);
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 52px;
        }

        .show-btn {
            position: absolute;
            right: 5px;
            top: 2px;
            width: 42px;
            height: 42px;
            padding: 0;
            margin: 0;
            background: transparent;
            color: #475569;
            border: none;
            font-size: 18px;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #0f172a;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-btn:hover {
            background: #1e293b;
        }

        .bottom {
            text-align: center;
            margin-top: 22px;
            color: #64748b;
            font-size: 14px;
        }

        a {
            color: #0f172a;
            text-decoration: none;
            font-weight: 600;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="icon">🔐</div>

    <h1>Welcome Back</h1>

    <p class="subtitle">
        Sign in to your secure account
    </p>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        <label>Email Address</label>

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <label>Password</label>

        <div class="password-box">

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button
                type="button"
                class="show-btn"
                onclick="togglePassword()"
            >👁</button>

        </div>

        <button class="login-btn" type="submit">
            Login
        </button>

    </form>

    <p class="bottom">
        Don't have an account?
        <a href="{{ url_for('register') }}">Create Account</a>
    </p>

</div>

<script>
function togglePassword() {
    const password = document.getElementById("password");
    const button = document.querySelector(".show-btn");

    if (password.type === "password") {
        password.type = "text";
        button.innerText = "🙈";
    } else {
        password.type = "password";
        button.innerText = "👁";
    }
}
</script>

</body>
</html>
